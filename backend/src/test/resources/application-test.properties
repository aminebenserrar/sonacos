spring.datasource.url=jdbc:h2:mem:sonacos-test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
app.security.jwt.secret=test-secret-key-test-secret-key-test
app.security.jwt.access-token-expiration-ms=86400000
app.security.cors.allowed-origins=http://localhost:3000
app.files.invoice-dir=build/test-invoices
