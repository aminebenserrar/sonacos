spring.application.name=sonacos-backend

server.port=${SERVER_PORT:8080}
server.error.include-message=never

spring.datasource.url=${SONACOS_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=sonacos_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SONACOS_DB_USERNAME:sonacos_app}
spring.datasource.password=${SONACOS_DB_PASSWORD:Sonacos@2026!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jackson.time-zone=Africa/Casablanca

app.security.jwt.secret=${SONACOS_JWT_SECRET:change-this-secret-key-to-a-long-random-value-please}
app.security.jwt.access-token-expiration-ms=${SONACOS_JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${SONACOS_FRONTEND_URL:http://localhost:3000}
app.files.invoice-dir=${SONACOS_INVOICE_DIR:generated/invoices}
app.files.product-image-dir=${SONACOS_PRODUCT_IMAGE_DIR:generated/uploads/products}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
